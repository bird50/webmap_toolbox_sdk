name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Examples typecheck and build
        run: |
          for example in react-maplibre leaflet; do
            (cd examples/$example && npm ci --install-links && npx tsc -p tsconfig.json --noEmit && npm run build)
          done
